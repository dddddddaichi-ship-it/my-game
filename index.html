<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>My Game</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      border: 0;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <h1>My Game</h1>

  <p>GitHub Pages テスト</p>

  <button id="button">
    TAP!
  </button>

  <p>
    SCORE:
    <span id="score">0</span>
  </p>

  <script>
    let score = 0;

    document
      .getElementById("button")
      .addEventListener("click", function () {

        score++;

        document
          .getElementById("score")
          .textContent = score;

      });
  </script>

</body>
</html>
